# =========================================================
# ESS CHATBOT SaaS — PRODUCTION NGINX REVERSE PROXY CONFIG
# =========================================================

# Upstream Next.js application server
upstream nextjs_upstream {
    server 127.0.0.1:3300;
    keepalive 32;
}

# Rate limiting zones (Nginx Level)
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=40r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS (managed by Cloudflare or Certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M; # Supports document and PDF knowledge uploads

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Trust Cloudflare & Reverse Proxy IP forwarding
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # --- 1. CRITICAL: SSE Streaming Route (/api/public/chat/*) ---
    # Must completely disable buffering so LLM tokens stream to the browser widget in real-time
    location ~* ^/api/public/chat/ {
        limit_req zone=chat_limit burst=10 nodelay;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # Disable all proxy buffering for progressive SSE delivery
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Connection headers
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended read timeout for inference generation (up to 90 seconds)
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;

        # Chunked transfer encoding
        chunked_transfer_encoding on;
    }

    # --- 2. Static Chatbot Widget Asset (/widget.js) ---
    # Safe CDN and browser caching for high performance
    location = /widget.js {
        proxy_pass http://nextjs_upstream/widget.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        access_log off;
    }

    # --- 3. Health & Readiness Endpoint ---
    location = /api/health {
        proxy_pass http://nextjs_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- 4. General Application Routes & Dashboard ---
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
